<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungans - Ai || Key Generate By @NandSki</title>

<style>
    * {
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: #fff;
    }

    .card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        border-radius: 18px;
        padding: 32px 26px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .icon {
        font-size: 48px;
        margin-bottom: 10px;
    }

    h1 {
        margin: 10px 0 8px;
        font-size: 26px;
        letter-spacing: 0.5px;
    }

    p {
        font-size: 14px;
        opacity: 0.85;
        margin-bottom: 18px;
    }

    .key-box {
        background: rgba(0,0,0,0.35);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 18px;
        word-break: break-all;
        border: 1px dashed rgba(255,255,255,0.25);
    }

    .key {
        font-size: 18px;
        font-weight: 600;
        color: #4da6ff;
    }

    button {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, #1e90ff, #00c6ff);
        color: #fff;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,198,255,0.4);
    }

    .hint {
        margin-top: 14px;
        font-size: 12px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<div class="card">
    <div class="icon">🔑</div>
    <h1>Dungans - Ai</h1>
    <p>Gunakan key ini dengan perintah:</p>
    <p><strong>/activatekey</strong> di Telegram Bot</p>

    <div class="key-box">
        <span class="key" id="key">Loading...</span>
    </div>

    <button onclick="copyKey()">Salin Key</button>

    <div class="hint">
        key ini bersifat 1x pakai per user ⚠️
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const key = urlParams.get('key') || 'No key provided';
    document.getElementById('key').textContent = key;

    function copyKey() {
        navigator.clipboard.writeText(key).then(() => {
            alert("Key berhasil disalin!");
        });
    }
</script>

</body>
</html>
