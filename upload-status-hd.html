<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload SW HD | 0x0.st</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #4A00E0;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .badge {
            background: linear-gradient(90deg, #8E2DE2, #4A00E0);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
        }

        .upload-area {
            border: 3px dashed #8E2DE2;
            border-radius: 15px;
            padding: 40px 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(142, 45, 226, 0.05);
        }

        .upload-area:hover {
            background: rgba(142, 45, 226, 0.1);
            border-color: #4A00E0;
        }

        .upload-icon {
            font-size: 50px;
            color: #8E2DE2;
            margin-bottom: 15px;
        }

        .upload-btn {
            background: linear-gradient(90deg, #8E2DE2, #4A00E0);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .file-info {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin: 20px 0;
            display: none;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8E2DE2, #4A00E0);
            width: 0%;
            transition: width 0.3s;
        }

        .result {
            background: rgba(142, 45, 226, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            display: none;
            border-left: 5px solid #8E2DE2;
        }

        .code {
            background: #4A00E0;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 18px;
            margin: 15px 0;
            cursor: pointer;
        }

        .wa-btn {
            background: #25D366;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: none;
            border-left: 4px solid #dc3545;
        }

        input[type="file"] {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-cloud-upload-alt"></i> Upload SW HD</h1>
        <p class="subtitle">Upload file ke 0x0.st & dapatkan kode ZERO-</p>
        
        <div class="badge">
            <i class="fas fa-shield-alt"></i> 0x0.st • 256MB • 30 Hari
        </div>
        
        <div class="upload-area" id="dropArea">
            <div class="upload-icon">
                <i class="fas fa-file-upload"></i>
            </div>
            <p>Klik atau drop file</p>
            <p style="color: #666; font-size: 13px; margin: 10px 0;">Max 256MB • Expire: 30 hari</p>
            <input type="file" id="fileInput">
            <button class="upload-btn" id="uploadBtn">Pilih File</button>
        </div>

        <div class="file-info" id="fileInfo">
            <p><strong>File:</strong> <span id="fileName">-</span></p>
            <p><strong>Ukuran:</strong> <span id="fileSize">-</span></p>
            <p><strong>Tipe:</strong> <span id="fileType">-</span></p>
        </div>

        <div class="error" id="errorMessage"></div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="result" id="result">
            <h3><i class="fas fa-check-circle"></i> Upload Berhasil!</h3>
            <p>Kode Anda:</p>
            <div class="code" id="code">ZERO-XXXXXX</div>
            <a href="#" class="wa-btn" id="waLink" target="_blank">
                <i class="fab fa-whatsapp"></i> Kirim ke WhatsApp Bot
            </a>
            <p style="color: #666; font-size: 12px; margin-top: 10px;">
                File akan expire dalam 30 hari
            </p>
        </div>
    </div>

    <script>
        const BOT_NUMBER = "+6285126839864";
        const MAX_SIZE = 256 * 1024 * 1024; // 256MB
        
        const elements = {
            fileInput: document.getElementById('fileInput'),
            uploadBtn: document.getElementById('uploadBtn'),
            dropArea: document.getElementById('dropArea'),
            fileInfo: document.getElementById('fileInfo'),
            fileName: document.getElementById('fileName'),
            fileSize: document.getElementById('fileSize'),
            fileType: document.getElementById('fileType'),
            errorMessage: document.getElementById('errorMessage'),
            progressBar: document.getElementById('progressBar'),
            progressFill: document.getElementById('progressFill'),
            result: document.getElementById('result'),
            code: document.getElementById('code'),
            waLink: document.getElementById('waLink')
        };

        let currentFile = null;

        // Setup event listeners
        elements.uploadBtn.addEventListener('click', () => elements.fileInput.click());
        elements.fileInput.addEventListener('change', handleFileSelect);
        
        // Drag & Drop
        elements.dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.dropArea.style.borderColor = '#4A00E0';
        });
        
        elements.dropArea.addEventListener('dragleave', () => {
            elements.dropArea.style.borderColor = '#8E2DE2';
        });
        
        elements.dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.dropArea.style.borderColor = '#8E2DE2';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        async function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        }
        
        async function handleFile(file) {
            // Reset
            hideError();
            elements.result.style.display = 'none';
            
            // Validasi ukuran
            if (file.size > MAX_SIZE) {
                showError('File terlalu besar! Maksimal 256MB');
                return;
            }
            
            currentFile = file;
            
            // Tampilkan info
            elements.fileName.textContent = file.name;
            elements.fileSize.textContent = formatBytes(file.size);
            elements.fileType.textContent = file.type || 'Unknown';
            elements.fileInfo.style.display = 'block';
            
            // Mulai upload
            startUpload();
        }
        
        async function startUpload() {
            if (!currentFile) return;
            
            showProgress(true);
            
            try {
                // Upload ke 0x0.st (NO CORS RESTRICTIONS!)
                updateProgress(30, 'Mengupload...');
                const result = await uploadTo0x0(currentFile);
                
                // Generate kode
                const fileId = result.split('/').pop();
                const code = `ZERO-${fileId}`;
                
                // Tampilkan hasil
                showResult(code);
                updateProgress(100, 'Selesai!');
                
            } catch (error) {
                showError(`Upload gagal: ${error.message}`);
                updateProgress(0, 'Gagal');
            } finally {
                setTimeout(() => showProgress(false), 1000);
            }
        }
        
        // Upload ke 0x0.st - NO CORS ISSUES
        async function uploadTo0x0(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            const response = await fetch('https://0x0.st', {
                method: 'POST',
                body: formData
                // NO CORS headers needed - 0x0.st allows all origins
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const text = await response.text();
            return text.trim(); // Returns direct URL like "https://0x0.st/xxxx"
        }
        
        function showResult(code) {
            elements.code.textContent = code;
            elements.waLink.href = `https://wa.me/${BOT_NUMBER}?text=${encodeURIComponent(code)}`;
            elements.result.style.display = 'block';
            elements.result.scrollIntoView({ behavior: 'smooth' });
            
            // Copy on click
            elements.code.addEventListener('click', () => {
                navigator.clipboard.writeText(code);
                const original = elements.code.textContent;
                elements.code.textContent = '✓ COPIED!';
                setTimeout(() => elements.code.textContent = original, 2000);
            });
        }
        
        function showProgress(show) {
            elements.progressBar.style.display = show ? 'block' : 'none';
            if (!show) {
                elements.progressFill.style.width = '0%';
            }
        }
        
        function updateProgress(percent, text) {
            elements.progressFill.style.width = `${percent}%`;
        }
        
        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.style.display = 'block';
        }
        
        function hideError() {
            elements.errorMessage.style.display = 'none';
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
