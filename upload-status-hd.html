<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload SW HD | Upload Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #00adb5;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .status {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #00adb5;
            border-radius: 10px;
            padding: 40px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 173, 181, 0.05);
        }

        .upload-area:hover {
            background: rgba(0, 173, 181, 0.1);
            border-color: #393e46;
        }

        .upload-icon {
            font-size: 50px;
            color: #00adb5;
            margin-bottom: 15px;
        }

        .upload-btn {
            background: #00adb5;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .file-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            display: none;
            border-left: 4px solid #00adb5;
        }

        .progress-container {
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00adb5, #393e46);
            width: 0%;
            transition: width 0.3s;
            border-radius: 5px;
        }

        .result {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            border-left: 4px solid #28a745;
            text-align: left;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: none;
            border-left: 4px solid #dc3545;
        }

        .url-box {
            background: white;
            border: 1px solid #00adb5;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
        }

        .copy-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-cloud-upload-alt"></i> Upload SW HD</h1>
        <p class="status">Pilih file untuk upload (Focus: Upload Success)</p>
        
        <div class="upload-area" id="dropArea">
            <div class="upload-icon">
                <i class="fas fa-file-upload"></i>
            </div>
            <p>Klik atau drop file</p>
            <p style="color: #666; font-size: 12px; margin: 10px 0;">Prioritas: Upload berhasil</p>
            <input type="file" id="fileInput">
            <button class="upload-btn" id="uploadBtn">Pilih File</button>
        </div>

        <div class="file-info" id="fileInfo">
            <p><strong>File:</strong> <span id="fileName">-</span></p>
            <p><strong>Ukuran:</strong> <span id="fileSize">-</span></p>
            <p><strong>Tipe:</strong> <span id="fileType">-</span></p>
        </div>

        <div class="error" id="errorMessage"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="progressText">Mengupload...</p>
        </div>

        <div class="result" id="result">
            <h3><i class="fas fa-check-circle"></i> Upload Berhasil!</h3>
            <p><strong>URL File:</strong></p>
            <div class="url-box" id="urlBox"></div>
            <button class="copy-btn" id="copyBtn">📋 Copy URL</button>
            <p style="color: #666; font-size: 12px; margin-top: 10px;">
                <i class="fas fa-info-circle"></i> File berhasil diupload ke server
            </p>
        </div>
    </div>

    <script>
        // Service yang kita coba (prioritas berhasil upload)
        const SERVICES = [
            {
                name: 'Catbox.moe',
                url: 'https://catbox.moe/user/api.php',
                method: 'POST',
                field: 'fileToUpload',
                params: { reqtype: 'fileupload' },
                processResponse: async (response) => {
                    const text = await response.text();
                    if (text.startsWith('http')) return text;
                    throw new Error('Catbox error: ' + text);
                }
            },
            {
                name: 'Tmpfiles.org', 
                url: 'https://tmpfiles.org/api/v1/upload',
                method: 'POST',
                field: 'file',
                processResponse: async (response) => {
                    const data = await response.json();
                    if (data.success) {
                        return `https://tmpfiles.org/dl/${data.data.url.split('/').pop()}`;
                    }
                    throw new Error('Tmpfiles error');
                }
            },
            {
                name: '0x0.st',
                url: 'https://0x0.st',
                method: 'POST',
                field: 'file',
                processResponse: async (response) => {
                    const text = await response.text();
                    if (text.startsWith('http')) return text.trim();
                    throw new Error('0x0.st error');
                }
            }
        ];

        // Elements
        const elements = {
            fileInput: document.getElementById('fileInput'),
            uploadBtn: document.getElementById('uploadBtn'),
            dropArea: document.getElementById('dropArea'),
            fileInfo: document.getElementById('fileInfo'),
            fileName: document.getElementById('fileName'),
            fileSize: document.getElementById('fileSize'),
            fileType: document.getElementById('fileType'),
            errorMessage: document.getElementById('errorMessage'),
            progressContainer: document.getElementById('progressContainer'),
            progressFill: document.getElementById('progressFill'),
            progressText: document.getElementById('progressText'),
            result: document.getElementById('result'),
            urlBox: document.getElementById('urlBox'),
            copyBtn: document.getElementById('copyBtn')
        };

        let currentFile = null;
        let isUploading = false;

        // Setup
        elements.uploadBtn.addEventListener('click', () => elements.fileInput.click());
        elements.fileInput.addEventListener('change', handleFileSelect);
        
        // Drag & Drop
        elements.dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.dropArea.style.borderColor = '#393e46';
        });
        
        elements.dropArea.addEventListener('dragleave', () => {
            elements.dropArea.style.borderColor = '#00adb5';
        });
        
        elements.dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.dropArea.style.borderColor = '#00adb5';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        // Copy URL button
        elements.copyBtn.addEventListener('click', copyURL);
        
        async function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        }
        
        async function handleFile(file) {
            // Reset
            hideError();
            elements.result.style.display = 'none';
            elements.fileInfo.style.display = 'none';
            
            // Validasi
            if (file.size > 100 * 1024 * 1024) { // 100MB
                showError('File terlalu besar! Maksimal 100MB');
                return;
            }
            
            currentFile = file;
            
            // Tampilkan info file
            elements.fileName.textContent = file.name;
            elements.fileSize.textContent = formatBytes(file.size);
            elements.fileType.textContent = file.type || 'Unknown';
            elements.fileInfo.style.display = 'block';
            
            // Mulai upload
            startUpload();
        }
        
        async function startUpload() {
            if (!currentFile || isUploading) return;
            
            isUploading = true;
            elements.uploadBtn.disabled = true;
            showProgress(true);
            updateProgress(10, 'Menyiapkan...');
            
            let uploadSuccess = false;
            let resultUrl = '';
            let serviceName = '';
            
            // Coba semua service sampai ada yang berhasil
            for (let service of SERVICES) {
                if (uploadSuccess) break;
                
                try {
                    updateProgress(30, `Mencoba ${service.name}...`);
                    console.log(`Trying ${service.name}...`);
                    
                    resultUrl = await tryUploadToService(service, currentFile);
                    serviceName = service.name;
                    uploadSuccess = true;
                    
                } catch (error) {
                    console.log(`${service.name} failed:`, error.message);
                    // Lanjut ke service berikutnya
                }
            }
            
            if (uploadSuccess) {
                // Tampilkan hasil
                showResult(resultUrl, serviceName);
                updateProgress(100, 'Berhasil!');
                
                // Simpan ke localStorage untuk riwayat
                saveToHistory(currentFile.name, resultUrl, serviceName);
                
            } else {
                showError('Semua service gagal. Coba file lain atau koneksi lebih baik.');
                updateProgress(0, 'Gagal');
            }
            
            isUploading = false;
            elements.uploadBtn.disabled = false;
            setTimeout(() => showProgress(false), 1500);
        }
        
        async function tryUploadToService(service, file) {
            const formData = new FormData();
            formData.append(service.field, file);
            
            // Tambah params jika ada
            if (service.params) {
                Object.entries(service.params).forEach(([key, value]) => {
                    formData.append(key, value);
                });
            }
            
            updateProgress(50, `Upload ke ${service.name}...`);
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 detik timeout
            
            try {
                const response = await fetch(service.url, {
                    method: service.method,
                    body: formData,
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                return await service.processResponse(response);
                
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }
        
        function showResult(url, serviceName) {
            elements.urlBox.textContent = url;
            elements.result.style.display = 'block';
            elements.result.scrollIntoView({ behavior: 'smooth' });
            
            // Update result message
            document.querySelector('#result h3').innerHTML = 
                `<i class="fas fa-check-circle"></i> Upload Berhasil! (${serviceName})`;
        }
        
        function showProgress(show) {
            elements.progressContainer.style.display = show ? 'block' : 'none';
            if (!show) {
                elements.progressFill.style.width = '0%';
                elements.progressText.textContent = 'Mengupload...';
            }
        }
        
        function updateProgress(percent, text) {
            elements.progressFill.style.width = `${percent}%`;
            elements.progressText.textContent = text;
        }
        
        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.style.display = 'block';
        }
        
        function hideError() {
            elements.errorMessage.style.display = 'none';
        }
        
        function copyURL() {
            const url = elements.urlBox.textContent;
            navigator.clipboard.writeText(url).then(() => {
                const original = elements.copyBtn.textContent;
                elements.copyBtn.textContent = '✅ COPIED!';
                setTimeout(() => {
                    elements.copyBtn.textContent = original;
                }, 2000);
            });
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function saveToHistory(filename, url, service) {
            try {
                const history = JSON.parse(localStorage.getItem('uploadHistory') || '[]');
                history.unshift({
                    filename: filename,
                    url: url,
                    service: service,
                    time: new Date().toISOString()
                });
                
                // Simpan max 10 item
                if (history.length > 10) history.pop();
                
                localStorage.setItem('uploadHistory', JSON.stringify(history));
            } catch (e) {
                // Ignore localStorage errors
            }
        }
    </script>
</body>
</html>
