<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload SW HD | Catbox.moe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background: white; border-radius: 10px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .upload-area { border: 2px dashed #667eea; border-radius: 10px; padding: 40px 20px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { background: #f8f9ff; border-color: #764ba2; }
        .upload-icon { font-size: 50px; color: #667eea; margin-bottom: 10px; }
        .upload-btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .upload-btn:hover { background: #764ba2; }
        .progress-bar { width: 100%; height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: #667eea; width: 0%; transition: width 0.3s; }
        .result-container { display: none; margin-top: 20px; padding: 20px; background: #f0f8ff; border-radius: 10px; border-left: 4px solid #667eea; }
        .code-box { background: #333; color: white; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 18px; margin: 15px 0; letter-spacing: 2px; cursor: pointer; }
        .whatsapp-btn { background: #25D366; color: white; text-decoration: none; padding: 15px; border-radius: 5px; display: block; font-weight: bold; margin-top: 15px; }
        .whatsapp-btn:hover { background: #1DA851; }
        .error { color: #ff4444; background: #fff0f0; padding: 10px; border-radius: 5px; margin: 10px 0; display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Upload SW HD</h1>
        <p class="subtitle">Upload media ke Catbox.moe & terima via WhatsApp Bot</p>
        
        <div class="upload-area" id="dropArea">
            <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
            <p style="color: #666; margin-bottom: 10px;">Klik atau drop file disini</p>
            <p style="color: #888; font-size: 12px; margin-bottom: 15px;">Maksimal 50MB (Catbox limit)</p>
            <input type="file" id="fileInput">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-folder-open"></i> Pilih File
            </button>
        </div>

        <div class="error" id="errorMessage"></div>

        <div class="progress-bar" id="progressContainer" style="display: none;">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="progressText" style="display: none;">Mengupload...</p>

        <div class="result-container" id="resultContainer">
            <h3><i class="fas fa-check-circle" style="color: #667eea;"></i> Upload Berhasil!</h3>
            <p style="color: #666; margin: 10px 0;">Kode Anda:</p>
            <div class="code-box" id="codeBox">
                <span id="codeText">NAND-XXXXXXX</span>
            </div>
            <a href="#" class="whatsapp-btn" id="whatsappLink" target="_blank">
                <i class="fab fa-whatsapp"></i> Kirim ke WhatsApp Bot
            </a>
        </div>
    </div>

    <script>
        // Konfigurasi
        const BOT_NUMBER = "+6285126839864";
        const MAX_SIZE_MB = 50; // Catbox limit 50MB
        
        // Elemen
        const fileInput = document.getElementById('fileInput');
        const errorMessage = document.getElementById('errorMessage');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultContainer = document.getElementById('resultContainer');
        const codeText = document.getElementById('codeText');
        const whatsappLink = document.getElementById('whatsappLink');
        
        // Setup
        fileInput.addEventListener('change', handleFileSelect);
        
        // Drag & Drop
        const dropArea = document.getElementById('dropArea');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });
        
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.style.borderColor = '#764ba2', false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.style.borderColor = '#667eea', false);
        });
        
        dropArea.addEventListener('drop', handleDrop, false);
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        function handleDrop(e) {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }
        
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }
        
        async function handleFile(file) {
            // Reset
            hideError();
            resultContainer.style.display = 'none';
            
            // Validasi
            if (file.size > MAX_SIZE_MB * 1024 * 1024) {
                showError(`File terlalu besar! Maksimal ${MAX_SIZE_MB}MB untuk Catbox.moe`);
                return;
            }
            
            // Tampilkan progress
            progressContainer.style.display = 'block';
            progressText.style.display = 'block';
            progressFill.style.width = '10%';
            
            try {
                // Upload menggunakan FormData langsung ke Catbox
                progressFill.style.width = '30%';
                progressText.textContent = 'Menyiapkan upload...';
                
                const shortUrl = await uploadToCatbox(file);
                
                // Generate kode
                const fileName = shortUrl.split('/').pop();
                const code = `NAND-${fileName}`;
                
                // Tampilkan hasil
                showResult(code);
                progressFill.style.width = '100%';
                progressText.textContent = 'Selesai!';
                
            } catch (error) {
                console.error('Upload error:', error);
                showError(`Upload gagal: ${error.message || 'Coba file lain atau lebih kecil'}`);
                progressContainer.style.display = 'none';
                progressText.style.display = 'none';
            }
        }
        
        // ===== METHOD 1: Direct upload ke Catbox (mungkin blocked CORS) =====
        async function uploadToCatbox(file) {
            const formData = new FormData();
            formData.append('fileToUpload', file);
            formData.append('reqtype', 'fileupload');
            
            progressFill.style.width = '50%';
            progressText.textContent = 'Mengupload ke Catbox...';
            
            try {
                // Coba endpoint utama
                const response = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                    // NO headers - biarkan browser set otomatis
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const result = await response.text();
                
                if (!result.startsWith('http')) {
                    throw new Error(result || 'Upload gagal');
                }
                
                return result;
                
            } catch (error) {
                // Jika gagal, coba method alternatif
                console.log('Method 1 gagal, coba method 2...');
                return await uploadToCatboxAlt(file);
            }
        }
        
        // ===== METHOD 2: Alternative Catbox API =====
        async function uploadToCatboxAlt(file) {
            progressText.textContent = 'Menggunakan metode alternatif...';
            
            // Convert file to base64
            const base64 = await fileToBase64(file);
            
            // Upload menggunakan base64 method
            const response = await fetch('https://catbox.moe/user/api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `reqtype=fileupload&userhash=&fileToUpload=${encodeURIComponent(base64)}`
            });
            
            const result = await response.text();
            
            if (!result.startsWith('http')) {
                throw new Error('Upload gagal dengan metode alternatif');
            }
            
            return result;
        }
        
        // ===== METHOD 3: Using Public Upload Service (Fallback) =====
        async function uploadToLitterbox(file) {
            progressText.textContent = 'Menggunakan Litterbox (Catbox alternative)...';
            
            const formData = new FormData();
            formData.append('fileToUpload', file);
            formData.append('reqtype', 'fileupload');
            
            const response = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
        
            const result = await response.text();
            
            if (result.includes('error')) {
                throw new Error(result);
            }
            
            // Litterbox URL format: https://litterbox.catbox.moe/filename.ext
            return result;
        }
        
        // ===== UTILITY FUNCTIONS =====
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    // Remove "data:image/jpeg;base64," prefix
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
            });
        }
        
        function showResult(code) {
            codeText.textContent = code;
            whatsappLink.href = `https://wa.me/${BOT_NUMBER}?text=${encodeURIComponent(code)}`;
            resultContainer.style.display = 'block';
            resultContainer.scrollIntoView({ behavior: 'smooth' });
            
            // Copy functionality
            codeBox.addEventListener('click', () => {
                navigator.clipboard.writeText(code);
                const original = codeText.textContent;
                codeText.textContent = '✓ COPIED!';
                setTimeout(() => codeText.textContent = original, 2000);
            });
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
        
        function hideError() {
            errorMessage.style.display = 'none';
        }
    </script>
</body>
</html>
