<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catbox.moe Uploader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #edf1ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            background: #e3e9ff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .file-info {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
        }

        .loading.active {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            display: none;
            margin-top: 30px;
            animation: slideUp 0.5s ease;
        }

        .result-container.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            color: #48bb78;
            font-size: 50px;
            margin-bottom: 15px;
        }

        .result-title {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .result-box {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .result-label {
            color: #667eea;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .result-link {
            color: #333;
            font-size: 1.1em;
            word-break: break-all;
            text-decoration: none;
            transition: color 0.3s;
            display: block;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }

        .result-link:hover {
            color: #764ba2;
            border-color: #667eea;
        }

        .copy-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .copy-btn:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .upload-another {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
        }

        .upload-another:hover {
            background: #667eea;
            color: white;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            color: #666;
            font-size: 0.9em;
        }

        .error-message {
            color: #e53e3e;
            background: #fed7d7;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            text-align: left;
        }

        .error-message.show {
            display: block;
        }

        .error-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .error-detail {
            font-size: 0.9em;
            color: #c53030;
        }

        .debug-info {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.8em;
            color: #4a5568;
            text-align: left;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        .debug-toggle {
            background: none;
            border: none;
            color: #667eea;
            font-size: 0.8em;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: underline;
        }

        .file-preview {
            max-width: 200px;
            max-height: 200px;
            margin: 15px auto;
            border-radius: 10px;
            display: none;
        }

        .file-preview.show {
            display: block;
        }

        .method-selector {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .method-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .method-btn.active {
            background: #667eea;
            color: white;
        }

        footer {
            margin-top: 30px;
            color: #888;
            font-size: 0.8em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            .upload-area {
                padding: 30px 15px;
            }
            
            .upload-btn {
                padding: 12px 30px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-cat"></i>
            <span>Catbox.moe</span>
        </div>
        <h1>Unggah File Anda</h1>
        <p class="subtitle">Upload file ke Catbox.moe dan dapatkan link yang dapat dibagikan</p>

        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <div class="upload-text">Klik atau seret file ke sini</div>
            <div class="file-info" id="fileInfo">Maksimal ukuran file: 200MB</div>
            <input type="file" class="file-input" id="fileInput">
            <img class="file-preview" id="filePreview" alt="Preview">
        </div>

        <!-- Method Selector -->
        <div class="method-selector">
            <button class="method-btn active" id="methodFetch">Fetch API</button>
            <button class="method-btn" id="methodXHR">XHR</button>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Mengunggah...</div>
        </div>

        <!-- Upload Button -->
        <button class="upload-btn" id="uploadBtn" disabled>
            <span>Upload File</span>
            <i class="fas fa-upload"></i>
            <i class="fas fa-spinner loading" id="loadingIcon"></i>
        </button>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage">
            <div class="error-title" id="errorTitle">Terjadi Kesalahan</div>
            <div class="error-detail" id="errorDetail"></div>
            <button class="debug-toggle" id="debugToggle">Tampilkan Detail Teknis</button>
            <div class="debug-info" id="debugInfo"></div>
        </div>

        <!-- Result Container -->
        <div class="result-container" id="resultContainer">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="result-title">Upload Berhasil!</div>
            <div class="result-box">
                <span class="result-label">Link File Anda:</span>
                <a href="#" class="result-link" id="resultLink" target="_blank"></a>
            </div>
            <button class="copy-btn" id="copyBtn">
                <i class="fas fa-copy"></i> Salin Link
            </button>
            <button class="upload-another" id="uploadAnotherBtn">
                <i class="fas fa-upload"></i> Upload File Lain
            </button>
        </div>

        <footer>
            <p>File akan dihosting di <a href="https://catbox.moe" target="_blank">catbox.moe</a> • Dibuat dengan ❤️</p>
        </footer>
    </div>

    <script>
        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const filePreview = document.getElementById('filePreview');
        const uploadBtn = document.getElementById('uploadBtn');
        const loadingIcon = document.getElementById('loadingIcon');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultContainer = document.getElementById('resultContainer');
        const resultLink = document.getElementById('resultLink');
        const copyBtn = document.getElementById('copyBtn');
        const uploadAnotherBtn = document.getElementById('uploadAnotherBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorTitle = document.getElementById('errorTitle');
        const errorDetail = document.getElementById('errorDetail');
        const debugToggle = document.getElementById('debugToggle');
        const debugInfo = document.getElementById('debugInfo');
        const methodFetch = document.getElementById('methodFetch');
        const methodXHR = document.getElementById('methodXHR');

        let selectedFile = null;
        let currentMethod = 'fetch'; // 'fetch' or 'xhr'

        // Event Listeners
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFileSelect(e.target.files[0]);
            }
        });

        uploadBtn.addEventListener('click', uploadFile);
        copyBtn.addEventListener('click', copyLink);
        uploadAnotherBtn.addEventListener('click', resetForm);
        debugToggle.addEventListener('click', toggleDebugInfo);
        methodFetch.addEventListener('click', () => switchMethod('fetch'));
        methodXHR.addEventListener('click', () => switchMethod('xhr'));

        // Functions
        function switchMethod(method) {
            currentMethod = method;
            
            // Update UI
            methodFetch.classList.remove('active');
            methodXHR.classList.remove('active');
            
            if (method === 'fetch') {
                methodFetch.classList.add('active');
            } else {
                methodXHR.classList.add('active');
            }
            
            console.log(`Metode upload diubah ke: ${method.toUpperCase()}`);
        }

        function handleFileSelect(file) {
            // Validasi ukuran file (max 200MB)
            const maxSize = 200 * 1024 * 1024;
            if (file.size > maxSize) {
                showError('Ukuran file terlalu besar!', `Maksimal 200MB, file Anda: ${(file.size / (1024 * 1024)).toFixed(2)}MB`);
                return;
            }

            selectedFile = file;
            
            // Update file info
            const fileSize = (file.size / (1024 * 1024)).toFixed(2);
            fileInfo.textContent = `${file.name} • ${fileSize} MB`;
            
            // Tampilkan preview untuk gambar
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    filePreview.src = e.target.result;
                    filePreview.classList.add('show');
                };
                reader.readAsDataURL(file);
            } else {
                filePreview.classList.remove('show');
            }
            
            // Enable upload button
            uploadBtn.disabled = false;
            
            // Reset error
            hideError();
        }

        async function uploadFile() {
            if (!selectedFile) return;
            
            hideError();
            uploadBtn.disabled = true;
            loadingIcon.classList.add('active');
            progressContainer.classList.add('show');
            progressFill.style.width = '0%';
            progressText.textContent = 'Menyiapkan...';
            
            // Pilih metode berdasarkan selection
            if (currentMethod === 'fetch') {
                await uploadWithFetch();
            } else {
                await uploadWithXHR();
            }
        }

        async function uploadWithFetch() {
            try {
                console.log('Menggunakan metode Fetch API...');
                
                const formData = new FormData();
                formData.append('fileToUpload', selectedFile);
                formData.append('reqtype', 'fileupload');
                
                // Tambahkan header referer untuk menghindari CORS issue
                const headers = new Headers();
                headers.append('Accept', '*/*');
                headers.append('Origin', window.location.origin);
                
                // Log info untuk debugging
                console.log('File info:', {
                    name: selectedFile.name,
                    type: selectedFile.type,
                    size: selectedFile.size,
                    method: 'fetch'
                });
                
                // Update progress
                progressText.textContent = 'Mengirim permintaan...';
                progressFill.style.width = '10%';
                
                const response = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    mode: 'cors',
                    credentials: 'omit',
                    headers: headers,
                    body: formData
                });
                
                console.log('Fetch Response:', {
                    status: response.status,
                    statusText: response.statusText,
                    headers: Object.fromEntries(response.headers.entries()),
                    ok: response.ok
                });
                
                progressFill.style.width = '50%';
                progressText.textContent = 'Memproses respons...';
                
                const resultText = await response.text();
                console.log('Response text:', resultText);
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status} - ${response.statusText}`);
                }
                
                // Validasi response
                if (!resultText || resultText.trim() === '' || resultText.includes('error')) {
                    throw new Error(`Respons tidak valid dari server: "${resultText}"`);
                }
                
                // Cek apakah response adalah URL valid
                if (!resultText.startsWith('http')) {
                    throw new Error(`Format URL tidak valid: "${resultText}"`);
                }
                
                progressFill.style.width = '100%';
                progressText.textContent = 'Selesai!';
                
                // Tunggu sebentar untuk animasi
                await new Promise(resolve => setTimeout(resolve, 500));
                
                showResult(resultText.trim());
                
            } catch (error) {
                console.error('Fetch error:', error);
                
                let errorMsg = error.message;
                let detailMsg = 'Silakan coba metode XHR atau coba lagi nanti.';
                
                if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                    errorMsg = 'Gagal terhubung ke server';
                    detailMsg = 'Pastikan koneksi internet Anda stabil dan tidak ada pemblokiran oleh browser.';
                } else if (error.message.includes('CORS')) {
                    errorMsg = 'Masalah keamanan browser';
                    detailMsg = 'Browser memblokir request. Coba metode XHR atau disable CORS restrictions.';
                }
                
                showError(errorMsg, detailMsg, error.stack);
                
                // Auto switch ke XHR jika fetch gagal karena CORS
                if (error.message.includes('CORS') || error.message.includes('Network')) {
                    console.log('Auto-switching ke metode XHR...');
                    setTimeout(() => {
                        switchMethod('xhr');
                        showError(errorMsg, `${detailMsg} Sudah beralih ke metode XHR. Coba upload lagi.`);
                    }, 1000);
                }
            } finally {
                loadingIcon.classList.remove('active');
                progressContainer.classList.remove('show');
            }
        }

        function uploadWithXHR() {
            return new Promise((resolve, reject) => {
                console.log('Menggunakan metode XMLHttpRequest...');
                
                const xhr = new XMLHttpRequest();
                const formData = new FormData();
                formData.append('fileToUpload', selectedFile);
                formData.append('reqtype', 'fileupload');
                
                // Setup progress tracking
                xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable) {
                        const percent = (event.loaded / event.total) * 100;
                        progressFill.style.width = `${percent}%`;
                        progressText.textContent = `Mengunggah... ${Math.round(percent)}%`;
                    }
                };
                
                xhr.onload = () => {
                    console.log('XHR Response:', {
                        status: xhr.status,
                        statusText: xhr.statusText,
                        response: xhr.responseText
                    });
                    
                    if (xhr.status === 200) {
                        const result = xhr.responseText.trim();
                        
                        if (!result || result.includes('error')) {
                            reject(new Error(`Respons tidak valid: "${result}"`));
                            return;
                        }
                        
                        if (!result.startsWith('http')) {
                            reject(new Error(`Format URL tidak valid: "${result}"`));
                            return;
                        }
                        
                        progressFill.style.width = '100%';
                        progressText.textContent = 'Selesai!';
                        
                        setTimeout(() => {
                            showResult(result);
                            resolve(result);
                        }, 500);
                    } else {
                        reject(new Error(`HTTP ${xhr.status}: ${xhr.statusText}`));
                    }
                };
                
                xhr.onerror = () => {
                    console.error('XHR Network error');
                    reject(new Error('Gagal terhubung ke server. Cek koneksi internet.'));
                };
                
                xhr.ontimeout = () => {
                    console.error('XHR Timeout');
                    reject(new Error('Timeout: Server terlalu lama merespons.'));
                };
                
                // Konfigurasi XHR
                xhr.open('POST', 'https://catbox.moe/user/api.php');
                xhr.timeout = 300000; // 5 menit timeout
                
                // Mulai upload
                progressFill.style.width = '5%';
                progressText.textContent = 'Memulai upload...';
                xhr.send(formData);
            }).catch(error => {
                console.error('XHR error:', error);
                showError('Upload dengan XHR gagal', error.message, error.stack);
                throw error;
            });
        }

        function showResult(url) {
            // Update result link
            resultLink.textContent = url;
            resultLink.href = url;
            
            // Tampilkan result container
            resultContainer.classList.add('show');
            
            // Scroll ke hasil
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            console.log('Upload berhasil! URL:', url);
        }

        async function copyLink() {
            try {
                await navigator.clipboard.writeText(resultLink.href);
                
                // Ubah teks button sementara
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                copyBtn.style.background = '#38a169';
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.style.background = '';
                }, 2000);
            } catch (error) {
                console.error('Copy failed:', error);
                showError('Gagal menyalin link', 'Browser tidak mengizinkan akses clipboard');
            }
        }

        function resetForm() {
            // Reset semua
            selectedFile = null;
            fileInput.value = '';
            fileInfo.textContent = 'Maksimal ukuran file: 200MB';
            filePreview.classList.remove('show');
            uploadBtn.disabled = true;
            resultContainer.classList.remove('show');
            hideError();
            
            // Scroll ke atas
            uploadArea.scrollIntoView({ behavior: 'smooth' });
        }

        function showError(title, detail, debug = '') {
            errorTitle.textContent = title;
            errorDetail.textContent = detail;
            debugInfo.textContent = debug || 'Tidak ada informasi debug tambahan.';
            
            errorMessage.classList.add('show');
            debugInfo.classList.remove('show');
            
            // Scroll ke error
            errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Reset upload state
            uploadBtn.disabled = false;
            loadingIcon.classList.remove('active');
            progressContainer.classList.remove('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function toggleDebugInfo() {
            debugInfo.classList.toggle('show');
        }

        // Animasi untuk upload area saat hover
        uploadArea.addEventListener('mouseenter', () => {
            uploadArea.style.transform = 'translateY(-5px)';
        });

        uploadArea.addEventListener('mouseleave', () => {
            uploadArea.style.transform = 'translateY(0)';
        });

        // Test koneksi ke Catbox saat page load
        window.addEventListener('load', async () => {
            console.log('Menguji koneksi ke Catbox.moe...');
            
            try {
                const testResponse = await fetch('https://catbox.moe', { 
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                console.log('Catbox.moe dapat diakses');
            } catch (error) {
                console.warn('Catbox.moe mungkin tidak dapat diakses:', error);
                showError(
                    'Info: Catbox.moe tidak dapat diakses', 
                    'Server mungkin sedang maintenance. Anda tetap bisa mencoba upload.',
                    error.message
                );
            }
        });

        console.log('Catbox.moe Uploader siap digunakan!');
        console.log('Tips: Jika Fetch API gagal, coba gunakan metode XHR.');
    </script>
</body>
</html>
